# Numele aplicatiei tale
spring.application.name=demo

# AICI E SECRETUL: Am schimbat 'mem' cu 'file:./data/chatdb'
spring.datasource.url=jdbc:h2:file:./data/chatdb;DB_CLOSE_ON_EXIT=FALSE

# Conexiunea la baza de date
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Permite vizualizarea bazei de date in browser (la localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Pastreaza datele vechi la restart si doar actualizeaza structura daca adaugi chestii noi in cod
spring.jpa.hibernate.ddl-auto=update